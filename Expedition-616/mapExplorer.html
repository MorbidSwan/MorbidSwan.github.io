<!DOCTYPE html>

<input
    type="number"
    id="cellX"
    name="cellX"
    min="1"
    max="17"
    placeholder="tile X"
    />

<input
    type="number"
    id="cellY"
    name="cellY"
    min="1"
    max="25"
    placeholder="tile Y"
    />

<input
    type="button"
    id="subBut"
    name="subBut"
    value="Submit"
    disabled="true"
    />

<input
    type="button"
    id="northwest"
    name="northwest"
    value="Northwest"
    disabled="true"
    />

<input
    type="button"
    id="north"
    name="north"
    value="North"
    disabled="true"
    />

<input
    type="button"
    id="northeast"
    name="northeast"
    value="Northeast"
    disabled="true"
    />

<input
    type="button"
    id="southeast"
    name="southeast"
    value="Southeast"
    disabled="true"
    />

<input
    type="button"
    id="south"
    name="south"
    value="South"
    disabled="true"
    />

<input
    type="button"
    id="southwest"
    name="southwest"
    value="Southwest"
    disabled="true"
    />

<script>
fetch('/assets/maps/overworld11.json')
    .then((response) => response.json())
    .then((json) => localStorage.setItem("mapJSON", JSON.stringify(json)));
</script>

<h3>Biome</h3>
<p id="cellBiome">Biome: None</p>
<p id="cellCity">City: None</p>
<p id="cellRoad">Road: None</p>
<p id="cellRiver">River: None</p>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const subBut = document.getElementById("subBut");
        const northwestBut = document.getElementById("northwest");
        const northBut = document.getElementById("north");
        const northeastBut = document.getElementById("northeast");
        const southwestBut = document.getElementById("southwest");
        const southBut = document.getElementById("south");
        const southeastBut = document.getElementById("southeast");
        const cellX = document.getElementById("cellX");
        let cellXtrans = Math.floor((cellX.valueAsNumber+1)/2)
        const cellY = document.getElementById("cellY");
        let cellYtrans = Math.floor(cellY.valueAsNumber)
        let cellAtrans = (cellX.valueAsNumber+1)%2
        const cellBiome = document.getElementById("cellBiome");
        const cellCity = document.getElementById("cellCity");
        const cellRoad = document.getElementById("cellRoad");
        const cellRiver = document.getElementById("cellRiver");

        cellX.onchange = function(){checkButtons()};
        cellY.onchange = function(){checkButtons()};
        subBut.addEventListener("click", function(){getCellData()});
        northwestBut.addEventListener("click", function(){moveCell(1-cellAtrans, cellXtrans-1+cellAtrans, cellYtrans-1+cellAtrans)})
        northBut.addEventListener("click", function(){moveCell(cellAtrans, cellXtrans, cellYtrans+1)})
        northeastBut.addEventListener("click", function(){moveCell(1-cellAtrans, cellXtrans+cellAtrans, cellYtrans-1+cellAtrans)})
        southwestBut.addEventListener("click", function(){moveCell(1-cellAtrans, cellXtrans-1+cellAtrans, cellYtrans+cellAtrans)})
        southBut.addEventListener("click", function(){moveCell(cellAtrans, cellXtrans, cellYtrans-1)})
        southeastBut.addEventListener("click", function(){moveCell(1-cellAtrans, cellXtrans+cellAtrans, cellYtrans+cellAtrans)})

        function getCellData(){
            let mapJson = JSON.parse(localStorage.getItem("mapJSON"));
            cellBiome.innerHTML = `Biome: ${mapJson.cells[cellAtrans][cellXtrans][cellYtrans].biome}`;
            cellCity.innerHTML = `City: ${mapJson.cells[cellAtrans][cellXtrans][cellYtrans].city}`;
            cellRoad.innerHTML = `Road: ${mapJson.cells[cellAtrans][cellXtrans][cellYtrans].road}`;
            cellRiver.innerHTML = `River: ${mapJson.cells[cellAtrans][cellXtrans][cellYtrans].river}`;
        }
        function checkButtons(){           
            cellAtrans = (cellX.valueAsNumber+1)%2
            cellXtrans = Math.floor((cellX.valueAsNumber+1)/2)
            cellYtrans = Math.floor(cellY.valueAsNumber)
            subBut.disabled = true
            northwestBut.disabled = true
            northBut.disabled = true
            northeastBut.disabled = true
            southwestBut.disabled = true
            southBut.disabled = true
            southeastBut.disabled = true
            if (cellX.value != null && cellY.value != null){
                subBut.disabled = false
                if (cellX.value > 1){
                    if (cellY.value > 1){
                        southwestBut.disabled = false
                        southBut.disabled = false
                    }
                    if (cellY.value < 25){
                        northwestBut.disabled = false
                        northBut.disabled = false
                    }
                }
                if (cellX.value < 17){
                    if (cellY.value > 1){
                        southeastBut.disabled = false
                        southBut.disabled = false
                    }
                    if (cellY.value < 25){
                        northeastBut.disabled = false
                        northBut.disabled = false
                    }
                }
            }
        }
        function moveCell(newa, newx, newy){
            cellX.value = ((newx+(newa/2)) * 2)
            cellY.value = newy
            checkButtons()
            getCellData()
        }
    })
</script>
