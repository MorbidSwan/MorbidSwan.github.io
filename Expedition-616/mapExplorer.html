<!DOCTYPE html>

<input
    type="number"
    id="cellA"
    name="cellA"
    min="0"
    max="1"
    placeholder="tile X"
    />

<input
    type="number"
    id="cellX"
    name="cellX"
    min="1"
    max="17"
    placeholder="tile X"
    />

<input
    type="number"
    id="cellY"
    name="cellY"
    min="1"
    max="25"
    placeholder="tile Y"
    />

<input
    type="button"
    id="subBut"
    name="subBut"
    value="Submit"
    disabled="true"
    />

<input
    type="button"
    id="northwest"
    name="northwest"
    value="Northwest"
    disabled="true"
    />

<input
    type="button"
    id="north"
    name="north"
    value="North"
    disabled="true"
    />

<input
    type="button"
    id="northeast"
    name="northeast"
    value="Northeast"
    disabled="true"
    />

<input
    type="button"
    id="southeast"
    name="southeast"
    value="Southeast"
    disabled="true"
    />

<input
    type="button"
    id="south"
    name="south"
    value="South"
    disabled="true"
    />

<input
    type="button"
    id="southwest"
    name="southwest"
    value="Southwest"
    disabled="true"
    />

<script>
fetch('/assets/maps/overworld11.json')
    .then((response) => response.json())
    .then((json) => localStorage.setItem("mapJSON", JSON.stringify(json)));
</script>

<h3>Biome</h3>
<p id="cellXtrans" value="0">X: None</p>
<p id="cellYtrans" value="0">Y: None</p>
<p id="cellBiome">Biome: None</p>
<p id="cellCity">City: None</p>
<p id="cellRoad">Road: None</p>
<p id="cellRiver">River: None</p>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const subBut = document.getElementById("subBut");
        const northwestBut = document.getElementById("northwest");
        const northBut = document.getElementById("north");
        const northeastBut = document.getElementById("northeast");
        const southwestBut = document.getElementById("southwest");
        const southBut = document.getElementById("south");
        const southeastBut = document.getElementById("southeast");
        const cellA = document.getElementById("cellA");
        const cellX = document.getElementById("cellX");
        const cellY = document.getElementById("cellY");
        const cellXtrans = document.getElementById("cellXtrans");
        const cellYtrans = document.getElementById("cellYtrans");
        const cellBiome = document.getElementById("cellBiome");
        const cellCity = document.getElementById("cellCity");
        const cellRoad = document.getElementById("cellRoad");
        const cellRiver = document.getElementById("cellRiver");

        cellA.onchange = function(){checkButtons()};
        cellX.onchange = function(){checkButtons()};
        cellY.onchange = function(){checkButtons()};
        subBut.addEventListener("click", function(){getCellData()});
        northwestBut.addEventListener("click", function(){moveCell(1-cellA.value, cellX.value-1+cellA.value, cellY.value-1+cellA.value)})
        northBut.addEventListener("click", function(){moveCell(cellA.value, cellX.value, cellY.value+1)})
        northeastBut.addEventListener("click", function(){moveCell(1-cellA.value, cellX.value+cellA.value, cellY.value-1+cellA.value)})
        southwestBut.addEventListener("click", function(){moveCell(1-cellA.value, cellX.value-1+cellA.value, cellY.value-cellA.value)})
        southBut.addEventListener("click", function(){moveCell(cellA.value, cellX.value, cellY.value-1)})
        southeastBut.addEventListener("click", function(){moveCell(1-cellA.value, cellX.value+cellA.value, cellY.value-cellA.value)})

        function getCellData(){
            let mapJson = JSON.parse(localStorage.getItem("mapJSON"));
            cellBiome.innerHTML = `Biome: ${mapJson.cells[cellA.value][cellX.value][cellY.value].biome}`;
            cellCity.innerHTML = `City: ${mapJson.cells[cellA.value][cellX.value][cellY.value].city}`;
            cellRoad.innerHTML = `Road: ${mapJson.cells[cellA.value][cellX.value][cellY.value].road}`;
            cellRiver.innerHTML = `River: ${mapJson.cells[cellA.value][cellX.value][cellY.value].river}`;
            cellXtrans.innerHTML = `X: ${cellXtrans.value}`;
            cellYtrans.innerHTML = `X: ${cellYtrans.value}`;
        }
        function checkButtons(){ 
            subBut.disabled = true
            northwestBut.disabled = true
            northBut.disabled = true
            northeastBut.disabled = true
            southwestBut.disabled = true
            southBut.disabled = true
            southeastBut.disabled = true
            if (cellXtrans.value != null && cellYtrans.value != null){
                subBut.disabled = false
                if (cellXtrans.value > 1){
                    if (cellYtrans.value > 1){
                        southwestBut.disabled = false
                        southBut.disabled = false
                    }
                    if (cellYtrans.value < 25){
                        northwestBut.disabled = false
                        northBut.disabled = false
                    }
                }
                if (cellXtrans.value < 17){
                    if (cellYtrans.value > 1){
                        southeastBut.disabled = false
                        southBut.disabled = false
                    }
                    if (cellYtrans.value < 25){
                        northeastBut.disabled = false
                        northBut.disabled = false
                    }
                }
            }
        }
        function moveCell(newa, newx, newy){
            cellA.value = newa
            cellX.value = newx
            cellY.value = newy
            cellXtrans.value = (newx*2)-(1-newa)
            cellYtrans.value = newy
            checkButtons()
            getCellData()
        }
    })
</script>
